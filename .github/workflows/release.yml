name: Spotifree build and preview release

on:
  push:
    branches: [new_spotify_v1]
    tags: ["v*"]
  pull_request:
    branches: [new_spotify_v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine
      - name: Configure
        run: cmake -S desktop -B build/desktop -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build/desktop --config Release --parallel
          ctest --test-dir build/desktop -C Release --output-on-failure
      - name: Stage application
        run: cmake --install build/desktop --config Release --prefix stage
      - name: Package
        run: Compress-Archive -Path stage/* -DestinationPath Spotifree-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: spotifree-windows-x64
          path: Spotifree-windows-x64.zip
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebengine
      - name: Configure
        run: >-
          cmake -S desktop -B build/desktop -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      - name: Build and test
        run: |
          cmake --build build/desktop --parallel
          ctest --test-dir build/desktop --output-on-failure
      - name: Stage application
        run: cmake --install build/desktop --prefix stage
      - name: Package
        run: hdiutil create -volname Spotifree -srcfolder stage -ov -format UDZO Spotifree-macos-universal.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: spotifree-macos-universal
          path: Spotifree-macos-universal.dmg
          if-no-files-found: error

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system build and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libegl1 libfontconfig1 libgl1 libnss3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebengine
      - name: Configure
        run: cmake -S desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build/desktop --parallel
          ctest --test-dir build/desktop --output-on-failure
      - name: Stage application
        run: cmake --install build/desktop --prefix stage
      - name: Package
        run: tar -czf Spotifree-linux-x64.tar.gz -C stage .
      - uses: actions/upload-artifact@v7
        with:
          name: spotifree-linux-x64
          path: Spotifree-linux-x64.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Install Android SDK platform
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: spotifree-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, desktop-macos, desktop-linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*/*
          --verify-tag --prerelease
          --title "Spotifree ${GITHUB_REF_NAME}"
          --notes "Preview builds generated from the new_spotify_v1 source. The Android APK uses the debug signing key. macOS is a universal build. These artifacts are unsigned preview releases; account, playback, DRM and platform packaging still require manual smoke testing."
